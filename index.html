<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<title>StudyPulse Question-to-PNG</title>
<meta name="author" content="Md Golam Mostofa">
<style>
:root{--blue:#2549d8;--navy:#202a82;--red:#ff3838;--ink:#090909}
*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#182033;font-family:"Tiro Bangla","Noto Sans Bengali","Nirmala UI",serif}
header{background:linear-gradient(110deg,var(--navy),var(--blue));color:#fff;padding:12px clamp(16px,4vw,38px);display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logoBox{background:#fff;border-radius:14px;padding:6px 12px;display:flex;align-items:center;box-shadow:0 3px 14px #0003}.logoBox img{height:72px;width:auto;display:block}
footer{max-width:1150px;margin:6px auto 26px;padding:0 16px;text-align:center;font-size:14px;color:#58647a}footer a{color:var(--blue);font-weight:700;text-decoration:none}footer a:hover{text-decoration:underline}
header h1{margin:0;font-size:clamp(20px,3.6vw,28px)}
main{max-width:1150px;margin:22px auto;padding:0 16px;display:grid;grid-template-columns:minmax(280px,1fr) minmax(280px,1fr);gap:20px}
.panel{background:#fff;border:1px solid #e0e5ef;border-radius:16px;padding:18px;box-shadow:0 5px 22px #1b2d5510}
h2{font-size:18px;margin:0 0 12px}label{display:block;font-weight:650;margin:12px 0 6px}
textarea,input,select{width:100%;border:1px solid #cbd3e2;border-radius:9px;padding:11px;font:inherit;background:#fff;color:#172033}
textarea{min-height:340px;resize:vertical;line-height:1.65}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
button{border:0;border-radius:10px;padding:11px 15px;font:inherit;font-weight:700;cursor:pointer;background:#e8ecf8;color:#17245b}
button.primary{background:var(--blue);color:white}button.dark{background:#17245b;color:white}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.note{font-size:13px;color:#58647a;line-height:1.6}
#status{margin:12px 0;font-size:14px;color:#34415c}
#previewWrap{background:#e9edf6;border-radius:12px;padding:10px;display:flex;justify-content:center;align-items:flex-start;min-height:320px}
canvas{width:100%;height:auto;max-width:440px;background:white;box-shadow:0 4px 16px #0002}
.pageNav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0}
.pageSet{background:#f6f8ff;border:1px dashed var(--blue);border-radius:12px;padding:10px 12px;margin:0 0 12px}
.pageSet strong{display:block;margin-bottom:6px;color:var(--navy);font-size:14px}
.pageSet .row{align-items:flex-end;gap:8px}.pageSet label{margin:0 0 4px;font-size:13px}
.pageSet .stepper{display:flex;gap:6px;align-items:center}.pageSet .stepper input{text-align:center;min-width:60px}
.pageSet button{padding:9px 12px}
.pageSet input:disabled,.pageSet button:disabled{opacity:.5;cursor:not-allowed}
[hidden]{display:none!important}
.tabs{max-width:1150px;margin:18px auto 0;padding:0 16px;display:flex;gap:10px;flex-wrap:wrap}
.tabs button{flex:1;min-width:200px;padding:13px 16px;font-size:16px;background:#fff;border:2px solid #d6ddf0;color:var(--navy)}
.tabs button.active{background:var(--blue);border-color:var(--blue);color:#fff}
#cPreview{background:#e9edf6;border-radius:12px;padding:10px;display:flex;justify-content:center;align-items:flex-start;min-height:320px}
#cPreview img{width:100%;max-width:560px;height:auto;box-shadow:0 4px 16px #0002;background:#fff}
.stepper{display:flex;gap:6px;align-items:center}.stepper input{text-align:center;min-width:64px}
@media(max-width:780px){main{grid-template-columns:1fr}textarea{min-height:270px}}
</style>
</head>

function toBn(s){return String(s).replace(/[0-9]/g,d=>'০১২৩৪৫৬৭৮৯'[+d]);}
function parseQuestions(text){
 const lines=text.replace(/\r/g,'').split('\n');
 const start=/^\s*(?:প্রশ্ন\s*)?([০-৯0-9]{1,3})\s*[.)।ঃ:]\s*/;
 if(!lines.some(l=>start.test(l))){ // নম্বর না থাকলে ফাঁকা লাইন দিয়ে আলাদা করবে
  return text.replace(/\r/g,'').split(/\n\s*\n+/).map(x=>x.trim()).filter(Boolean);
 }
 let blocks=[],cur=[];
 for(const line of lines){
   if(start.test(line)&&cur.some(x=>x.trim())){blocks.push(cur.join('\n').trim());cur=[line.trim()];}
   else cur.push(line);
 }
 if(cur.some(x=>x.trim())) blocks.push(cur.join('\n').trim());
 return blocks.filter(x=>x);
}
function wrap(ctx,text,maxWidth){
 let out=[];
 for(const paragraph of String(text).split('\n')){
  if(!paragraph){out.push('');continue}
  let line='';
  for(const word of paragraph.split(/\s+/)){
   const test=line?line+' '+word:word;

 drawCardDeco(ctx);
 // সাদা কার্ড
 rr(ctx,136,137,959,801,26);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#d3d6da';ctx.lineWidth=2;ctx.stroke();
 drawCardMath(ctx);
 if(logoImg){ctx.save();ctx.globalAlpha=.13;const ww=480,hh=ww*logoImg.naturalHeight/logoImg.naturalWidth;ctx.drawImage(logoImg,618-ww/2,567-hh/2,ww,hh);ctx.restore();}
 // লেখা
 const zoneTop=196,zoneH=548,maxW=815,x0=208;
 const paras=[];
 if(info.q.length){const q=info.q.slice();q[0]=qFirst(q[0],opt.label);paras.push(q.join('\n'));}
 if(info.a.length)paras.push(info.a.join('\n'));
 // if(info.e.length)paras.push(info.e.join('\n'));
 let size=opt.size,lay=layoutCard(paras,size,ctx,maxW);
 while(lay.total>zoneH&&size>20){size--;lay=layoutCard(paras,size,ctx,maxW);}
 const shrunk=size<opt.size,overflow=lay.total>zoneH;
 ctx.fillStyle='#000';ctx.textAlign='left';ctx.textBaseline='middle';ctx.font=size+'px '+BN_FONT;
 let y=zoneTop;
 lay.groups.forEach((g,gi)=>{g.forEach(l=>{ctx.fillText(l,x0,y+lay.lineH/2);y+=lay.lineH;});y+=lay.gap;});
 // কার্ডের নিচের ব্র্যান্ড অংশ
 if(logoImg){const lw=88,lh=lw*logoImg.naturalHeight/logoImg.naturalWidth;ctx.drawImage(logoImg,210,826-lh/2,lw,lh);}
 ctx.textBaseline='middle';ctx.fillStyle='#111';ctx.font='700 40px '+SANS;ctx.fillText(opt.brand,320,800);
 ctx.fillStyle='#666b73';ctx.font='400 34px '+SANS;ctx.fillText(opt.sub,320,850);
 // নিচের কালো বাটন
 const cat=info.cat||opt.cat;
 ctx.font='40px '+BN_FONT;const bw=Math.max(300,Math.round(ctx.measureText(cat).width+110));
 rr(ctx,136,978,bw,117,22);ctx.fillStyle='#000';ctx.fill();
 ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(cat,136+bw/2,1038);
 // ফেসবুক আইডি
 ctx.textAlign='left';ctx.font='700 36px '+SANS;const fw=ctx.measureText(opt.fb).width,fx=1092-fw;
 ctx.fillStyle='#111';ctx.fillText(opt.fb,fx,1038);
 const cx=fx-16-21,cy=1036;ctx.fillStyle='#1877f2';ctx.beginPath();ctx.arc(cx,cy,22,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#fff';ctx.font='700 34px Arial,sans-serif';ctx.textAlign='center';ctx.fillText('f',cx+2,cy+7);
 const blob=await canvasBlob(c);
 return {blob,shrunk,overflow};
}
function cardOpt(){return {size:clampN($('cFont').value,20,80,46),label:$('cLabel').value,cat:$('cCategory').value.trim()||'সাধারণ জ্ঞান',brand:$('cBrand').value.trim()||'StudyPulse',sub:$('cSub').value.trim(),fb:$('cFb').value.trim()};}
function cardName(i){return `StudyPulse-Card-${String(i+1).padStart(2,'0')}.png`;}
let cardBusy=false;
async function renderCards(){
 if(cardBusy)return;
 const text=$('cSource').value.trim();
 if(!text){$('cStatus').textContent='আগে প্রশ্নের লেখা পেস্ট করুন।';return;}
 const blocks=parseQuestions(text);
 if(!blocks.length){$('cStatus').textContent='প্রশ্ন শনাক্ত করা যায়নি।';return;}
 cardBusy=true;setCardButtons(false);
 try{
  await loadCardFonts();
  const logoImg=await loadImage(document.querySelector('.logoBox img').src),opt=cardOpt(),out=[];
  cardWarn=0;cardShrunk=0;
  for(let i=0;i<blocks.length;i++){
   $('cStatus').textContent=`কার্ড তৈরি হচ্ছে ${toBn(i+1)}/${toBn(blocks.length)}...`;
   const r=await drawCard(parseCardBlock(blocks[i]),logoImg,opt);
   if(!r.blob)throw new Error('ছবি তৈরি হয়নি');
   out.push(r.blob);if(r.shrunk)cardShrunk++;if(r.overflow)cardWarn++;
   await new Promise(r=>setTimeout(r,0));
  }
  cardBlobs=out;cardIndex=Math.min(cardIndex,out.length-1);
  showCard();buildCardDl();setCardButtons(true);
  $('cStatus').textContent=`${toBn(out.length)}টি প্রশ্ন → ${toBn(out.length)}টি কার্ড তৈরি হয়েছে।`+(cardShrunk?` ${toBn(cardShrunk)}টি কার্ডে জায়গার জন্য লেখা ছোট করা হয়েছে।`:'')+(cardWarn?` সতর্কতা: ${toBn(cardWarn)}টি কার্ডে লেখা এখনও আঁটেনি, লেখা ছোট করুন।`:'');
 }catch(e){$('cStatus').textContent='কার্ড তৈরিতে সমস্যা: '+e.message;}
 cardBusy=false;
}
function showCard(){
 const box=$('cPreview');box.innerHTML='';
 if(cardUrl){URL.revokeObjectURL(cardUrl);cardUrl=null;}
 if(!cardBlobs.length){$('cLabelNum').textContent='কার্ড 0 / 0';return;}
 cardUrl=URL.createObjectURL(cardBlobs[cardIndex]);
 const im=document.createElement('img');im.src=cardUrl;im.alt='কার্ড';box.appendChild(im);
 $('cLabelNum').textContent=`কার্ড ${cardIndex+1} / ${cardBlobs.length}`;
}
function buildCardDl(){
 const box=$('cDl');box.innerHTML='';
 cardBlobs.forEach((b,i)=>{const btn=document.createElement('button');btn.type='button';btn.textContent='⬇ কার্ড '+toBn(i+1);btn.onclick=()=>saveBlob(b,cardName(i));box.appendChild(btn);});
}
function setCardButtons(on){['cDownloadBtn','cDownloadAllBtn','cZipBtn','cOpenBtn'].forEach(id=>$(id).disabled=!on);if(!on)$('cDl').innerHTML='';}
$('cRender').onclick=()=>{cardIndex=0;renderCards();};
$('cSample').onclick=()=>{$('cSource').value=cardSample;cardIndex=0;renderCards();};
$('cClear').onclick=()=>{$('cSource').value='';cardBlobs=[];cardIndex=0;showCard();setCardButtons(false);$('cStatus').textContent='';};
$('cPrev').onclick=()=>{if(!cardBlobs.length)return;cardIndex=(cardIndex-1+cardBlobs.length)%cardBlobs.length;showCard();};
$('cNext').onclick=()=>{if(!cardBlobs.length)return;cardIndex=(cardIndex+1)%cardBlobs.length;showCard();};
$('cFontUp').onclick=()=>{$('cFont').value=clampN($('cFont').value,20,80,46)+1;if(cardBlobs.length)renderCards();};
$('cFontDown').onclick=()=>{$('cFont').value=clampN($('cFont').value,20,80,46)-1;if(cardBlobs.length)renderCards();};
let _ct=null;['cFont','cCategory','cLabel','cBrand','cSub','cFb'].forEach(id=>$(id).addEventListener('change',()=>{if(!cardBlobs.length)return;clearTimeout(_ct);_ct=setTimeout(renderCards,300);}));
$('cDownloadBtn').onclick=()=>cardBlobs.length&&saveBlob(cardBlobs[cardIndex],cardName(cardIndex));
$('cDownloadAllBtn').onclick=async()=>{
 const n=cardBlobs.length;if(!n)return;
 for(let i=0;i<n;i++){
  $('cStatus').textContent=`ডাউনলোড হচ্ছে ${toBn(i+1)}/${toBn(n)} — ব্রাউজার একাধিক ফাইলের অনুমতি চাইলে “Allow” দিন।`;
  saveBlob(cardBlobs[i],cardName(i));await new Promise(r=>setTimeout(r,900));
 }
 $('cStatus').textContent=`${toBn(n)}টি ফাইলের ডাউনলোড শুরু হয়েছে। সব না নামলে নিচের কার্ড-বাটন চেপে একটি একটি করে নামান বা ZIP নিন।`;
};
$('cZipBtn').onclick=async()=>{
 if(!cardBlobs.length)return;
 try{const files=[];for(let i=0;i<cardBlobs.length;i++)files.push({name:cardName(i),data:new Uint8Array(await cardBlobs[i].arrayBuffer())});saveBlob(makeZip(files),'StudyPulse-Cards.zip');}
 catch(e){$('cStatus').textContent='ZIP তৈরি করা যায়নি: '+e.message;}
};
$('cOpenBtn').onclick=()=>{
 if(!cardBlobs[cardIndex])return;
 const url=URL.createObjectURL(cardBlobs[cardIndex]);
 if(!window.open(url,'_blank'))$('cStatus').textContent='নতুন ট্যাব খোলা যায়নি — পপ-আপের অনুমতি দিন, অথবা প্রিভিউ ছবিতে চেপে ধরে Save করুন।';
 setTimeout(()=>URL.revokeObjectURL(url),120000);
};
/* ===== ট্যাব ===== */
function setMode(m){
 $('modePage').hidden=m!=='page';$('modeCard').hidden=m!=='card';
 $('tabPage').classList.toggle('active',m==='page');$('tabCard').classList.toggle('active',m==='card');
}
$('tabPage').onclick=()=>setMode('page');$('tabCard').onclick=()=>setMode('card');
</script>
</body></html>
